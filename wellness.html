  :root {

    --accent-2: #eab308;
    --header-bg: #1f1a13;
    --yellow-banner: #a16207;
    --green: #4ade80;
  }

  html {
    color-scheme: dark;
  }
}

* {
  box-sizing: border-box;
}

  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 0;

}
